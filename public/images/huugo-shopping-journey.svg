<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" fill="#edf2ec"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="64" font-size="20" fill="#21483c" font-weight="600">HUUGO FROM FRUUGO</text><text x="48" y="110" font-size="30" fill="#172d30" font-weight="600">From a shopping goal to an informed choice</text><text x="48" y="148" font-size="18" fill="#49565b">Conversation supports discovery. Structured information supports decisions.</text><rect x="48.0" y="190" width="266.0" height="112" rx="8" fill="#fff" stroke="#cbd6ce"/><circle cx="75.0" cy="218" r="12" fill="#21483c"/><text x="75.0" y="223" font-size="14" text-anchor="middle" fill="#fff">1</text><text x="66.0" y="258" font-size="18" fill="#172d30">Describe your</text><text x="66.0" y="283" font-size="18" fill="#172d30">shopping goal</text><rect x="328.0" y="190" width="266.0" height="112" rx="8" fill="#fff" stroke="#cbd6ce"/><circle cx="355.0" cy="218" r="12" fill="#21483c"/><text x="355.0" y="223" font-size="14" text-anchor="middle" fill="#fff">2</text><text x="346.0" y="258" font-size="18" fill="#172d30">Inspect and refine</text><text x="346.0" y="283" font-size="18" fill="#172d30">the options</text><rect x="608.0" y="190" width="266.0" height="112" rx="8" fill="#fff" stroke="#cbd6ce"/><circle cx="635.0" cy="218" r="12" fill="#21483c"/><text x="635.0" y="223" font-size="14" text-anchor="middle" fill="#fff">3</text><text x="626.0" y="258" font-size="18" fill="#172d30">Choose the</text><text x="626.0" y="283" font-size="18" fill="#172d30">next action</text><text x="48" y="353" font-size="17" fill="#49565b">Experience illustration, not a production screenshot.</text></g></svg>