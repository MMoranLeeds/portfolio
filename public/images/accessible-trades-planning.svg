<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><rect width="960" height="400" fill="#edf2ec"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="64" font-size="20" fill="#21483c" font-weight="600">ACCESSIBLE TRADES</text><text x="48" y="110" font-size="30" fill="#172d30" font-weight="600">Support the surrounding decisions</text><text x="48" y="148" font-size="18" fill="#49565b">The topics needed depend on each person’s circumstances.</text><rect x="48.0" y="190" width="196.0" height="112" rx="8" fill="#ffffff" stroke="#cbd6ce"/><circle cx="75.0" cy="218" r="12" fill="#21483c"/><text x="75.0" y="223" font-size="14" text-anchor="middle" fill="#fff">1</text><text x="66.0" y="258" font-size="18" fill="#172d30">Assessments</text><rect x="258.0" y="190" width="196.0" height="112" rx="8" fill="#ffffff" stroke="#cbd6ce"/><circle cx="285.0" cy="218" r="12" fill="#21483c"/><text x="285.0" y="223" font-size="14" text-anchor="middle" fill="#fff">2</text><text x="276.0" y="258" font-size="18" fill="#172d30">Funding</text><rect x="468.0" y="190" width="196.0" height="112" rx="8" fill="#ffffff" stroke="#cbd6ce"/><circle cx="495.0" cy="218" r="12" fill="#21483c"/><text x="495.0" y="223" font-size="14" text-anchor="middle" fill="#fff">3</text><text x="486.0" y="258" font-size="18" fill="#172d30">Permissions</text><rect x="678.0" y="190" width="196.0" height="112" rx="8" fill="#ffffff" stroke="#cbd6ce"/><circle cx="705.0" cy="218" r="12" fill="#21483c"/><text x="705.0" y="223" font-size="14" text-anchor="middle" fill="#fff">4</text><text x="696.0" y="258" font-size="18" fill="#172d30">Comparing</text><text x="696.0" y="283" font-size="18" fill="#172d30">quotations</text><text x="48" y="353" font-size="17" fill="#49565b">Planning topics, not a fixed sequence of required steps.</text></g></svg>